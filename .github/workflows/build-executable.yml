name: Compilar IoTSentinel

on:
  workflow_dispatch:
  push:
    branches: [main, monitoreo-hogar, gateway-casos]
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'main.py'
      - 'requirements*.txt'
      - '.github/workflows/build-executable.yml'

permissions:
  contents: read

jobs:
  executable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
            file: dist/IoTSentinel.exe
          - os: ubuntu-22.04
            name: Linux-x64
            file: dist/IoTSentinel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m scripts.check_receptor
      - run: python -m scripts.check_recuperacion
      - run: python -m scripts.evidencia_cifrado
      - run: python -m scripts.check_continuous
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - run: go test ./scripts/remover
        env:
          GO111MODULE: "off"
      - name: Validar el lanzador portátil y el broker incluidos
        if: runner.os == 'Windows'
        run: python -m scripts.check_windows_portable
      - name: Empaquetar la edición portátil para Windows
        if: runner.os == 'Windows'
        run: python scripts/package_portable.py release/IoTSentinel-Windows-x64.zip
      - name: Comprobar segundo plano y desinstalación del ZIP
        if: runner.os == 'Windows'
        run: python -m scripts.check_windows_removal release/IoTSentinel-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: IoTSentinel-portatil
          path: release/IoTSentinel-Windows-x64.zip
          if-no-files-found: error
      - run: python scripts/build_executable.py
      - run: python scripts/check_demo.py "${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: IoTSentinel-${{ matrix.name }}
          path: ${{ matrix.file }}
          if-no-files-found: error
